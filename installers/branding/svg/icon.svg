<!--
  RiverCrossing app icon (master, 1024x1024).

  Motif: playing card + stopwatch = "timed poker run" (Phase 8, P8-D6).
  Constraints honoured: no <text> (letterforms are paths), no SVG filters,
  flat solid fills, minimum feature size >= 64/1024 units so the silhouette
  survives a 16 px render, macOS rounded-rect plate baked into the artwork
  (824x824 plate, r=185, per the Apple icon grid).

  Rasterised by tools/gen_app_icons.py (rsvg-convert); the SVG is the only
  editable source - regenerate, never retouch the rasters.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">

  <!-- macOS plate: felt green with a subtle inner rim -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1E5C3F"/>
  <rect x="128" y="128" width="768" height="768" rx="160" fill="none"
        stroke="#2E7A54" stroke-width="10"/>

  <!-- playing card, tilted left -->
  <g transform="translate(430 470) rotate(-14)">
    <rect x="-170" y="-235" width="340" height="470" rx="36"
          fill="#FBFBF4" stroke="#1F2937" stroke-width="14"/>
    <!-- centre spade pip -->
    <path transform="scale(0.55)"
          d="M 0 -150
             C 90 -60 150 -10 150 60
             C 150 130 80 160 30 130
             C 40 180 70 210 95 225
             L -95 225
             C -70 210 -40 180 -30 130
             C -80 160 -150 130 -150 60
             C -150 -10 -90 -60 0 -150 Z"
          fill="#111827"/>
    <!-- corner index 'A' drawn as strokes (top-left, and rotated bottom-right) -->
    <g stroke="#111827" stroke-width="16" stroke-linecap="round" fill="none">
      <path d="M -132 -140 L -110 -196 L -88 -140 M -124 -158 L -96 -158"/>
    </g>
    <g transform="rotate(180)" stroke="#111827" stroke-width="16"
       stroke-linecap="round" fill="none">
      <path d="M -132 -140 L -110 -196 L -88 -140 M -124 -158 L -96 -158"/>
    </g>
  </g>

  <!-- stopwatch, overlapping the card's lower-right corner -->
  <g transform="translate(650 620)">
    <!-- crown and pusher sit behind the bezel -->
    <rect x="-26" y="-296" width="52" height="52" rx="12"
          fill="#E8EAED" stroke="#1F2937" stroke-width="12"/>
    <rect x="-16" y="-258" width="32" height="34"
          fill="#E8EAED" stroke="#1F2937" stroke-width="12"/>
    <g transform="rotate(42)">
      <rect x="-22" y="-286" width="44" height="44" rx="10"
            fill="#E8EAED" stroke="#1F2937" stroke-width="12"/>
    </g>
    <!-- bezel + face -->
    <circle r="228" fill="#E8EAED" stroke="#1F2937" stroke-width="16"/>
    <circle r="180" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="8"/>
    <!-- quarter ticks -->
    <g stroke="#1F2937" stroke-width="18" stroke-linecap="round">
      <path d="M 0 -158 L 0 -118"/>
      <path d="M 158 0 L 118 0"/>
      <path d="M 0 158 L 0 118"/>
      <path d="M -158 0 L -118 0"/>
    </g>
    <!-- hand at ten-past, poker-chip orange -->
    <path d="M 0 0 L 88 -96" stroke="#F59E0B" stroke-width="26"
          stroke-linecap="round" fill="none"/>
    <circle r="24" fill="#1F2937"/>
  </g>
</svg>
