# RiverCrossing — signed release lane (E9.1.3).
#
# module-skeletons.md S2: release.yml "arrives with EPIC 9 signing".
# A version tag runs every wired stage in ci.yml and this workflow
# publishes the GitHub release: the macOS DMG signed with a Developer
# ID identity and notarized through notarytool, plus both Windows
# installers (x64 + ARM64). Windows stays unsigned by decision
# (R-01, no Authenticode certificate) -- no codesign step for the
# .exe files.
#
# Advisory gate (task-briefs.md E9.1.3; secrets contract E1.1.2):
# Apple's signing credentials are org-supplied. When the APPLE_*
# secrets below are absent, the macOS leg logs a reason, skips
# codesign/notarytool/spctl and publishes the unsigned DMG built by
# ci.yml's build-macos job -- the unsigned path is green meanwhile,
# the signed path is green once the org supplies real secret values.
# The secret names are the standard Apple Developer API layout
# (APPLE_CERTIFICATE_B64 = base64 .p12, APPLE_CERT_PASSWORD,
# APPLE_DEVELOPER_ID = "Developer ID Application: ..." identity,
# APPLE_NOTARY_KEY_ID / APPLE_NOTARY_KEY / APPLE_NOTARY_ISSUER =
# App Store Connect API key). All six must be set or the gate falls
# back to unsigned; partial sets are treated as absent.
#
# NOTE (E9.1.3 wiring, for the human reviewer): the gauntlet jobs
# named in `needs` below live in ci.yml. GitHub Actions resolves
# `needs` only inside one workflow file, and actions/download-artifact
# reads artifacts from one run, so this file as committed cannot yet
# execute against ci.yml's tag run -- it is the signed-lane contract
# (validated here by yaml.safe_load) and ci.yml's `release` job stays
# as the unsigned fallback. Wiring a real tag run means either
# re-declaring the gauntlet jobs in this file or triggering via
# `workflow_run` on ci.yml once stage 4 (`acceptance`) lands; when
# that happens, retire ci.yml's `release` job so the two lanes never
# both call `gh release create`.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: "6 · Publish signed release (tags)"
    needs: [static, unit, functional, acceptance, build-macos, build-windows-x64, build-windows-arm64]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # Org supplies these (E1.1.2). An unset secret evaluates to the
      # empty string, which is what the advisory gate below checks.
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_B64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      # Kept verbatim from ci.yml's release job: a tag whose name does
      # not match rivercrossing.__version__ fails the lane (v0.1.1 was
      # tagged over 0.1.0 code and shipped empty; never again).
      - name: Tag matches rivercrossing.__version__
        run: |
          version="$(python3 -c "import sys; sys.path.insert(0, 'src'); import rivercrossing; print(rivercrossing.__version__)")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match rivercrossing.__version__ ${version} -- bump the version before tagging" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"

      - name: Detect Apple signing secrets (advisory gate)
        id: signing
        run: |
          missing=0
          for secret in APPLE_DEVELOPER_ID APPLE_CERTIFICATE_B64 APPLE_CERT_PASSWORD \
            APPLE_NOTARY_KEY_ID APPLE_NOTARY_KEY APPLE_NOTARY_ISSUER; do
            if [[ -z "${!secret}" ]]; then
              missing=1
            fi
          done
          if (( missing == 0 )); then
            echo "signed=1" >> "${GITHUB_OUTPUT}"
            echo "Apple signing secrets present -- Developer ID + notarization enabled"
          else
            echo "signed=0" >> "${GITHUB_OUTPUT}"
            echo "APPLE_* signing secrets absent (E1.1.2) -- skipping codesign/notarytool/spctl; publishing the unsigned DMG; signed path green once creds land" >&2
          fi

      # ------------------------------------------------ signed path
      - name: Download the macOS dev bundle
        if: steps.signing.outputs.signed == '1'
        uses: actions/download-artifact@v4
        with:
          name: rivercrossing-devbundle-macos
          path: devbundle

      # Standard Apple CI keychain recipe: import the Developer ID
      # .p12 into a throwaway keychain and let codesign use it without
      # a GUI prompt. RUNNER_TEMP is cleaned with the job.
      - name: Import the Apple Developer ID certificate
        if: steps.signing.outputs.signed == '1'
        run: |
          keychain="${RUNNER_TEMP}/rivercrossing-signing.keychain-db"
          echo "${APPLE_CERTIFICATE_B64}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p "${RUNNER_TEMP}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${RUNNER_TEMP}" "${keychain}"
          security import "${RUNNER_TEMP}/certificate.p12" -k "${keychain}" -P "${APPLE_CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${RUNNER_TEMP}" "${keychain}"
          security default-keychain -s "${keychain}"

      - name: Developer ID codesign the .app
        if: steps.signing.outputs.signed == '1'
        run: |
          codesign --deep --force --options runtime --sign "${APPLE_DEVELOPER_ID}" "devbundle/dist/RiverCrossing.app"

      - name: Rebuild the DMG from the signed .app
        if: steps.signing.outputs.signed == '1'
        run: |
          mkdir -p dist
          cp -R "devbundle/dist/RiverCrossing.app" "dist/RiverCrossing.app"
          nox -s dmg

      - name: Notarize the DMG
        if: steps.signing.outputs.signed == '1'
        run: |
          version="${GITHUB_REF_NAME#v}"
          # APPLE_NOTARY_KEY holds the App Store Connect API key (.p8).
          echo "${APPLE_NOTARY_KEY}" > "${RUNNER_TEMP}/authkey.p8"
          xcrun notarytool submit "dist/RiverCrossing-${version}.dmg" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --key "${RUNNER_TEMP}/authkey.p8" \
            --issuer "${APPLE_NOTARY_ISSUER}" \
            --wait

      - name: Staple the notarization ticket
        if: steps.signing.outputs.signed == '1'
        run: |
          version="${GITHUB_REF_NAME#v}"
          xcrun stapler staple "dist/RiverCrossing-${version}.dmg"

      - name: Gatekeeper assessment of the signed .app
        if: steps.signing.outputs.signed == '1'
        run: |
          spctl --assess --type open --context context:primary-signature "dist/RiverCrossing.app"

      - name: Stage the signed DMG
        if: steps.signing.outputs.signed == '1'
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p assets
          mv "dist/RiverCrossing-${version}.dmg" "assets/RiverCrossing-${version}.dmg"

      # ------------------------------------ unsigned fallback path
      - name: Download the unsigned DMG (advisory fallback)
        if: steps.signing.outputs.signed != '1'
        uses: actions/download-artifact@v4
        with:
          name: rivercrossing-dmg
          path: assets

      # upload-artifact@v4 preserves workspace-relative paths, so the
      # artifact lands as assets/dist/RiverCrossing-<version>.dmg; the
      # flat layout is handled too.
      - name: Normalize the unsigned DMG
        if: steps.signing.outputs.signed != '1'
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd assets || exit 1
          if [[ ! -f "RiverCrossing-${version}.dmg" && -f "dist/RiverCrossing-${version}.dmg" ]]; then
            mv "dist/RiverCrossing-${version}.dmg" "RiverCrossing-${version}.dmg"
          fi
          if [[ ! -f "RiverCrossing-${version}.dmg" ]]; then
            echo "no RiverCrossing-${version}.dmg inside the rivercrossing-dmg artifact" >&2
            exit 1
          fi

      # -------------------------------------------------- both paths
      - name: Download the Windows x64 installer
        uses: actions/download-artifact@v4
        with:
          name: rivercrossing-setup-windows-x64
          path: assets
      - name: Download the Windows ARM64 installer
        uses: actions/download-artifact@v4
        with:
          name: rivercrossing-setup-windows-arm64
          path: assets

      # The build jobs name the installers already arch-tagged
      # (RiverCrossing-<version>-windows-x64-setup.exe etc.); move them
      # up from the artifact's dist/ prefix if it has one.
      - name: Normalize the Windows installers
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd assets || exit 1
          for arch in x64 arm64; do
            file="RiverCrossing-${version}-windows-${arch}-setup.exe"
            if [[ ! -f "${file}" && -f "dist/${file}" ]]; then
              mv "dist/${file}" "${file}"
            fi
            if [[ ! -f "${file}" ]]; then
              echo "no ${file} inside the rivercrossing-setup-windows-${arch} artifact" >&2
              exit 1
            fi
          done

      - name: Assemble the assets with checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd assets || exit 1
          rm -rf dist
          mv "RiverCrossing-${version}.dmg" "RiverCrossing-${version}-macos.dmg"
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --generate-notes assets/*
