# RiverCrossing CI — the six-stage gauntlet from design/docs-md/spec.md §14.
#
# EPIC 1 wires stages 1, 2, 3 and 5. Stage 4 (Acceptance) needs the full race,
# which arrives in EPIC 9. Phase 9 added the unsigned per-user NSIS installer
# to the Windows stage-5 leg (the unsigned half of E9.1.2); Phase 11 added the
# unsigned half of stage 6 -- a version tag runs every wired stage and, when
# green, publishes the GitHub release with the macOS DMG, both Windows
# installers (x64 + ARM64) and their checksums. E9.1.3 wires Developer ID
# signing + notarization into the same tag release job (below), gated on
# the APPLE_* secrets; the unsigned DMG is the fallback until they land.
# Windows stays unsigned by decision (R-01 -- no Authenticode certificate).
#
# **Both platforms gate** (spec §14, R-75). The EPIC 1 deviation that made
# macOS the only gate — no Windows test machine existed — was reversed in
# Phase 10 after every known Windows failure was root-caused and fixed
# (modal-harness sentinel clobber, MSW default-item focus, the scenario
# close prompt, Fit()-derived sizing, mypy output color). Stages 1–2 run as
# a three-OS matrix (macOS, Windows x64, Windows ARM64); stage 3 stays
# macOS + Windows x64; stage 5 is one build job per OS/architecture because
# the artifacts genuinely differ (unsigned DMG vs unsigned NSIS setup .exe
# per Windows arch).

name: CI

on:
  push:
    branches: ["master", "topic/**"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PYTHON_VERSION: "3.14"
  # Windows consoles default to cp1252 and several of our tools print Unicode.
  # Harmless on macOS; on Windows it is the difference between a real result
  # and a UnicodeEncodeError from the reporting layer.
  PYTHONUTF8: "1"

jobs:
  # ---------------------------------------------------------------- stage 1
  static:
    name: "1 · Static (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: ruff
        run: ruff check . && ruff format --check --diff .
      - name: mypy --strict
        run: mypy
      - name: import-linter (wx confined to ui; demo seam removable)
        run: lint-imports
      - name: ids.py drift vs .xrc (R-05)
        run: python tools/gen_ids.py --check
      - name: Install pinned Tailwind CLI (E6.2.1)
        run: npm ci
      - name: css artifacts drift vs templates (E6.2.1)
        run: python tools/gen_css.py --check

  # ---------------------------------------------------------------- stage 2
  unit:
    name: "2 · Unit + property (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: pytest (coverage gate >= 90% line and branch)
        run: pytest tests/unit tests/property tests/simulations -m "not functional"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------- stage 3
  functional:
    name: "3 · Functional UI (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"

      # §14 claims the hosted runners have a real desktop session, so no
      # Xvfb. Prove it before 23 windows depend on it, and measure whether
      # UIActionSimulator actually delivers events here -- locally it does
      # not, because the process never becomes the OS-active app.
      - name: Desktop-session probe
        run: python tools/ci_gui_probe.py
      - name: Upload probe screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-probe-${{ matrix.os }}
          path: ci-gui-probe.png
          if-no-files-found: warn

      # Per-file worker processes plus §4's auto-retry (bumped to two,
      # PR #8's CI run 31344728049). Both are load-bearing: see
      # noxfile.py's functional session for the measurements. --reruns 2
      # cannot absorb the residual wx/SIP wrapper-cache corruption
      # (process-granular, docs/EPIC3-SESSION-SUMMARY.md Addendum 2), so
      # the command runs through tools/functional_rerun.py, which re-runs
      # failed files in freshly spawned pytest processes.
      - name: pytest functional (real wx windows)
        run: python tools/functional_rerun.py pytest tests/functional -v --no-cov -n auto --dist loadfile --reruns 2
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.os }}
          path: |
            tests/functional/_screenshots/**
            *.png
          if-no-files-found: ignore

  # ---------------------------------------------------------------- stage 4
  # E9.2.1 (EPIC 9): the full R-74 acceptance race -- CSV in, hundreds of
  # typed crossings, stop/continue, kill+relaunch, quit+relaunch, finish,
  # reopen -> correct -> finish again, all four exports verified. This is
  # the release gate (spec §14 stage 4) and joins the tag run via the
  # release job's `needs` below. Same per-file fresh-process rerun wrapper
  # as stage 3 (the wx/SIP wrapper-cache flake control, noxfile.py).
  acceptance:
    name: "4 · Acceptance race (${{ matrix.os }})"
    needs: [static, unit]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: pytest acceptance (full R-74 race, real wx windows)
        run: python tools/functional_rerun.py pytest tests/acceptance -v --no-cov -n auto --dist loadfile --reruns 2
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-acceptance-${{ matrix.os }}
          path: |
            tests/functional/_screenshots/**
            *.png
          if-no-files-found: ignore

  # ------------------------------------------------------- stage 5 · macOS
  build-macos:
    name: "5 · Build dev bundle (macOS)"
    needs: [static, unit]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: PyInstaller onedir (unsigned dev bundle)
        run: nox -s bundle
      - name: Smoke the built bundle
        run: nox -s smoke
      - name: Build unsigned DMG
        run: nox -s dmg
      - name: Smoke the DMG
        run: nox -s dmg_smoke
      - name: Package the dev bundle (tar preserves the symlinks)
        run: tar -czf rivercrossing-app.tgz -C dist RiverCrossing.app
      - name: Upload dev bundle
        uses: actions/upload-artifact@v4
        with:
          name: rivercrossing-devbundle-macos
          path: rivercrossing-app.tgz
          if-no-files-found: error
      # The release job needs just the DMG -- its own artifact spares it
      # a 118 MB devbundle download for one file.
      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: rivercrossing-dmg
          path: dist/RiverCrossing-*.dmg
          if-no-files-found: error

  # ----------------------------------------------------- stage 5 · Windows
  # The unsigned half of E9.1.2 (Phase 9), blocking since Phase 10: build
  # the dev bundle, smoke it, compile the unsigned per-user NSIS installer
  # and drive the silent install -> launch -> silent uninstall suite. Two
  # jobs -- one per CPU architecture -- because PyInstaller cannot cross-
  # compile and each artifact is native to its runner. The x64 image has
  # no NSIS, so it installs it with Chocolatey (choco nsis 3.12.0 matches
  # the local brew makensis 3.12); the ARM64 image ships NSIS 3.10
  # preinstalled. Authenticode signing remains stage 6 / E9.1.2.
  build-windows-x64:
    name: "5 · Build dev bundle + installer (Windows x64)"
    needs: [static, unit]
    runs-on: windows-latest
    env:
      RIVERCROSSING_EXPECT_WIN_ARCH: x64
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Detect SignPath signing config (advisory gate)
        id: signing
        shell: pwsh
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          )
          $missing = $required | Where-Object { [string]::IsNullOrEmpty((Get-Item "Env:$_").Value) }
          if ($missing.Count -gt 0) {
            "signed=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "SignPath config absent ($($missing -join ', ')) -- unsigned installer; signed path green once creds land"
          }
          else {
            "signed=1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "SignPath config present -- Authenticode signing enabled"
          }
      - name: PyInstaller onedir (unsigned dev bundle)
        run: nox -s bundle
      - name: Smoke the built bundle
        run: nox -s smoke
      - name: Upload the bootloader for signing
        id: upload-bootloader
        if: steps.signing.outputs.signed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: rivercrossing-bootloader-x64
          path: dist/rivercrossing/rivercrossing.exe
          if-no-files-found: error
      - name: Submit the bootloader signing request
        if: steps.signing.outputs.signed == '1'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-bootloader.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed/bootloader
      - name: Restore the signed bootloader
        if: steps.signing.outputs.signed == '1'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path signed/bootloader -Recurse -Filter rivercrossing.exe | Select-Object -First 1
          if (-not $signed) { throw "no signed rivercrossing.exe in signed/bootloader" }
          Copy-Item $signed.FullName dist/rivercrossing/rivercrossing.exe -Force
      - name: Install NSIS (absent from the windows-2025 image)
        run: choco install nsis -y --no-progress
      - name: Compile the installer
        run: nox -s winsetup
      - name: Upload the installer for signing
        id: upload-setup
        if: steps.signing.outputs.signed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: rivercrossing-setup-signing-x64
          path: dist/RiverCrossing-*-setup.exe
          if-no-files-found: error
      - name: Submit the installer signing request
        if: steps.signing.outputs.signed == '1'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed/setup
      - name: Restore the signed installer
        if: steps.signing.outputs.signed == '1'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path signed/setup -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $signed) { throw "no signed setup.exe in signed/setup" }
          Copy-Item $signed.FullName "dist/$($signed.Name)" -Force
      - name: Verify the Authenticode signatures
        if: steps.signing.outputs.signed == '1'
        shell: pwsh
        run: |
          $boot = Get-AuthenticodeSignature "dist/rivercrossing/rivercrossing.exe"
          $setup = Get-AuthenticodeSignature (Get-ChildItem -Path dist -Filter '*-setup.exe').FullName
          if ($boot.Status -ne 'Valid') { throw "bootloader signature invalid: $($boot.Status)" }
          if ($setup.Status -ne 'Valid') { throw "installer signature invalid: $($setup.Status)" }
          Write-Host "bootloader: $($boot.Status)  installer: $($setup.Status)"
      - name: Silent install, launch, uninstall (E9.1.2)
        run: nox -s winsetup_smoke
      - name: Upload the setup executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rivercrossing-setup-windows-x64
          path: dist/RiverCrossing-*-setup.exe
          if-no-files-found: warn
      - name: Upload the Windows dev bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rivercrossing-devbundle-windows-x64
          path: dist/rivercrossing/**
          if-no-files-found: ignore
      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winsetup-diagnostics-x64
          path: |
            build/winsetup-logs/**
            *.png
          if-no-files-found: ignore

  build-windows-arm64:
    name: "5 · Build dev bundle + installer (Windows ARM64)"
    needs: [static, unit]
    runs-on: windows-11-arm
    env:
      RIVERCROSSING_EXPECT_WIN_ARCH: arm64
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Detect SignPath signing config (advisory gate)
        id: signing
        shell: pwsh
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG'
          )
          $missing = $required | Where-Object { [string]::IsNullOrEmpty((Get-Item "Env:$_").Value) }
          if ($missing.Count -gt 0) {
            "signed=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "SignPath config absent ($($missing -join ', ')) -- unsigned installer; signed path green once creds land"
          }
          else {
            "signed=1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "SignPath config present -- Authenticode signing enabled"
          }
      - name: PyInstaller onedir (unsigned dev bundle)
        run: nox -s bundle
      - name: Smoke the built bundle
        run: nox -s smoke
      - name: Upload the bootloader for signing
        id: upload-bootloader
        if: steps.signing.outputs.signed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: rivercrossing-bootloader-arm64
          path: dist/rivercrossing/rivercrossing.exe
          if-no-files-found: error
      - name: Submit the bootloader signing request
        if: steps.signing.outputs.signed == '1'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-bootloader.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed/bootloader
      - name: Restore the signed bootloader
        if: steps.signing.outputs.signed == '1'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path signed/bootloader -Recurse -Filter rivercrossing.exe | Select-Object -First 1
          if (-not $signed) { throw "no signed rivercrossing.exe in signed/bootloader" }
          Copy-Item $signed.FullName dist/rivercrossing/rivercrossing.exe -Force
      # NSIS 3.10 is preinstalled on windows-11-arm; no choco install.
      - name: Compile the installer
        run: nox -s winsetup
      - name: Upload the installer for signing
        id: upload-setup
        if: steps.signing.outputs.signed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: rivercrossing-setup-signing-arm64
          path: dist/RiverCrossing-*-setup.exe
          if-no-files-found: error
      - name: Submit the installer signing request
        if: steps.signing.outputs.signed == '1'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed/setup
      - name: Restore the signed installer
        if: steps.signing.outputs.signed == '1'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path signed/setup -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $signed) { throw "no signed setup.exe in signed/setup" }
          Copy-Item $signed.FullName "dist/$($signed.Name)" -Force
      - name: Verify the Authenticode signatures
        if: steps.signing.outputs.signed == '1'
        shell: pwsh
        run: |
          $boot = Get-AuthenticodeSignature "dist/rivercrossing/rivercrossing.exe"
          $setup = Get-AuthenticodeSignature (Get-ChildItem -Path dist -Filter '*-setup.exe').FullName
          if ($boot.Status -ne 'Valid') { throw "bootloader signature invalid: $($boot.Status)" }
          if ($setup.Status -ne 'Valid') { throw "installer signature invalid: $($setup.Status)" }
          Write-Host "bootloader: $($boot.Status)  installer: $($setup.Status)"
      - name: Silent install, launch, uninstall (E9.1.2)
        run: nox -s winsetup_smoke
      - name: Upload the setup executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rivercrossing-setup-windows-arm64
          path: dist/RiverCrossing-*-setup.exe
          if-no-files-found: warn
      - name: Upload the Windows dev bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rivercrossing-devbundle-windows-arm64
          path: dist/rivercrossing/**
          if-no-files-found: ignore
      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winsetup-diagnostics-arm64
          path: |
            build/winsetup-logs/**
            *.png
          if-no-files-found: ignore

  # ---------------------------------------------------- stage 6 · release
  # A version tag that survives the full gauntlet publishes the GitHub
  # release: the macOS DMG and both Windows installers (x64 + ARM64) with
  # their checksums, named in the platform-tagged style the v0.1.0 release
  # established. The guard fails the job -- publishing nothing -- when the
  # tag does not match rivercrossing.__version__ (v0.1.1 was tagged over
  # 0.1.0 code and shipped empty; never again).
  #
  # macOS signing (E9.1.3) is wired directly into this job because it runs
  # in the same workflow run that holds the artifacts: when all six
  # APPLE_* secrets are present, the macOS leg Developer-ID signs the .app,
  # rebuilds the DMG from the signed app, notarizes and staples it, and
  # spctl-checks it before staging; with any secret missing it publishes
  # the unsigned DMG built by build-macos (the advisory gate -- partial
  # sets count as absent, so the unsigned path stays green until the org
  # supplies credentials). The signed lane once lived in
  # .github/workflows/release.yml, but GitHub resolves `needs` only inside
  # one workflow file and download-artifact reads artifacts from one run,
  # so a separate lane cannot reach the gauntlet's jobs or artifacts;
  # release.yml was retired so two lanes never both call `gh release
  # create` and one fails on the existing release.
  release:
    name: "6 · Publish release (tags)"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static, unit, functional, acceptance, build-macos, build-windows-x64, build-windows-arm64]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # Org supplies these (E1.1.2). An unset secret evaluates to the
      # empty string, which is what the advisory gate below checks.
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_B64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches rivercrossing.__version__
        run: |
          version="$(python3 -c "import sys; sys.path.insert(0, 'src'); import rivercrossing; print(rivercrossing.__version__)")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match rivercrossing.__version__ ${version} -- bump the version before tagging" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Detect Apple signing secrets (advisory gate)
        id: signing
        run: |
          missing=0
          for secret in APPLE_DEVELOPER_ID APPLE_CERTIFICATE_B64 APPLE_CERT_PASSWORD \
            APPLE_NOTARY_KEY_ID APPLE_NOTARY_KEY APPLE_NOTARY_ISSUER; do
            if [[ -z "${!secret}" ]]; then
              missing=1
            fi
          done
          if (( missing == 0 )); then
            echo "signed=1" >> "${GITHUB_OUTPUT}"
            echo "Apple signing secrets present -- Developer ID + notarization enabled"
          else
            echo "signed=0" >> "${GITHUB_OUTPUT}"
            echo "APPLE_* signing secrets absent (E1.1.2) -- publishing the unsigned DMG; signed path green once creds land" >&2
          fi
      # ------------------------------------------------ signed path
      - name: Download the macOS dev bundle
        if: steps.signing.outputs.signed == '1'
        uses: actions/download-artifact@v4
        with:
          name: rivercrossing-devbundle-macos
          path: devbundle
      - name: Extract the macOS dev bundle
        if: steps.signing.outputs.signed == '1'
        run: tar -xzf devbundle/rivercrossing-app.tgz -C devbundle
      # Standard Apple CI keychain recipe: import the Developer ID .p12
      # into a throwaway keychain and let codesign use it without a GUI
      # prompt. RUNNER_TEMP is cleaned with the job.
      - name: Import the Apple Developer ID certificate
        if: steps.signing.outputs.signed == '1'
        run: |
          keychain="${RUNNER_TEMP}/rivercrossing-signing.keychain-db"
          echo "${APPLE_CERTIFICATE_B64}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p "${RUNNER_TEMP}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${RUNNER_TEMP}" "${keychain}"
          security import "${RUNNER_TEMP}/certificate.p12" -k "${keychain}" -P "${APPLE_CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${RUNNER_TEMP}" "${keychain}"
          security default-keychain -s "${keychain}"
      - name: Developer ID codesign the .app
        if: steps.signing.outputs.signed == '1'
        run: |
          app="devbundle/RiverCrossing.app"
          [ -d "${app}" ] || { echo "no RiverCrossing.app after extract" >&2; ls devbundle >&2; exit 1; }
          fw="${app}/Contents/Frameworks/Python.framework"
          # The .app travels as a tarball: tar preserves the symlinks
          # PyInstaller creates, which upload/download-artifact's zip does
          # not (dereferencing them made codesign report the bundle as
          # "ambiguous"). Sign inside-out, not with --deep (deprecated).
          find "${app}/Contents" -type f \( -name '*.dylib' -o -name '*.so' \) -print0 \
            | xargs -0 -I{} codesign --force --options runtime --timestamp --sign "${APPLE_DEVELOPER_ID}" {}
          codesign --force --options runtime --timestamp --sign "${APPLE_DEVELOPER_ID}" "${fw}/Versions/Current/Python"
          codesign --force --options runtime --timestamp --sign "${APPLE_DEVELOPER_ID}" "${fw}"
          codesign --force --options runtime --timestamp --sign "${APPLE_DEVELOPER_ID}" \
            --entitlements installers/entitlements.plist "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"
      - name: Rebuild the DMG from the signed .app
        if: steps.signing.outputs.signed == '1'
        run: |
          app="devbundle/RiverCrossing.app"
          [ -d "${app}" ] || { echo "no RiverCrossing.app after extract" >&2; exit 1; }
          mkdir -p dist
          ditto "${app}" "dist/RiverCrossing.app"
          nox -s dmg
      - name: Notarize the DMG
        if: steps.signing.outputs.signed == '1'
        run: |
          version="${GITHUB_REF_NAME#v}"
          # APPLE_NOTARY_KEY holds the App Store Connect API key (.p8).
          echo "${APPLE_NOTARY_KEY}" > "${RUNNER_TEMP}/authkey.p8"
          xcrun notarytool submit "dist/RiverCrossing-${version}.dmg" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --key "${RUNNER_TEMP}/authkey.p8" \
            --issuer "${APPLE_NOTARY_ISSUER}" \
            --wait
      - name: Staple the notarization ticket
        if: steps.signing.outputs.signed == '1'
        run: |
          version="${GITHUB_REF_NAME#v}"
          xcrun stapler staple "dist/RiverCrossing-${version}.dmg"
      - name: Gatekeeper assessment of the signed .app
        if: steps.signing.outputs.signed == '1'
        run: |
          spctl --assess --type open --context context:primary-signature "dist/RiverCrossing.app"
      - name: Stage the signed DMG
        if: steps.signing.outputs.signed == '1'
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p assets
          mv "dist/RiverCrossing-${version}.dmg" "assets/RiverCrossing-${version}.dmg"
      # ------------------------------------ unsigned fallback path
      - name: Download the unsigned DMG (advisory fallback)
        if: steps.signing.outputs.signed != '1'
        uses: actions/download-artifact@v4
        with:
          name: rivercrossing-dmg
          path: assets
      # upload-artifact@v4 preserves workspace-relative paths, so the
      # artifact lands as assets/dist/RiverCrossing-<version>.dmg; the
      # flat layout is handled too.
      - name: Normalize the unsigned DMG
        if: steps.signing.outputs.signed != '1'
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd assets || exit 1
          if [[ ! -f "RiverCrossing-${version}.dmg" && -f "dist/RiverCrossing-${version}.dmg" ]]; then
            mv "dist/RiverCrossing-${version}.dmg" "RiverCrossing-${version}.dmg"
          fi
          if [[ ! -f "RiverCrossing-${version}.dmg" ]]; then
            echo "no RiverCrossing-${version}.dmg inside the rivercrossing-dmg artifact" >&2
            exit 1
          fi
      # -------------------------------------------------- both paths
      - name: Download the Windows x64 installer
        uses: actions/download-artifact@v4
        with:
          name: rivercrossing-setup-windows-x64
          path: assets
      - name: Download the Windows ARM64 installer
        uses: actions/download-artifact@v4
        with:
          name: rivercrossing-setup-windows-arm64
          path: assets
      # The build jobs name the installers already arch-tagged
      # (RiverCrossing-<version>-windows-x64-setup.exe etc.); move them
      # up from the artifact's dist/ prefix if it has one.
      - name: Normalize the Windows installers
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd assets || exit 1
          for arch in x64 arm64; do
            file="RiverCrossing-${version}-windows-${arch}-setup.exe"
            if [[ ! -f "${file}" && -f "dist/${file}" ]]; then
              mv "dist/${file}" "${file}"
            fi
            if [[ ! -f "${file}" ]]; then
              echo "no ${file} inside the rivercrossing-setup-windows-${arch} artifact" >&2
              exit 1
            fi
          done
      - name: Assemble the assets with checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd assets || exit 1
          rm -rf dist
          mv "RiverCrossing-${version}.dmg" "RiverCrossing-${version}-macos.dmg"
          # macOS lacks GNU sha256sum unless coreutils is linked; the
          # BSD shasum emits the same "hash  filename" format.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- * > SHA256SUMS.txt
          else
            shasum -a 256 -- * > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
            --generate-notes assets/*
